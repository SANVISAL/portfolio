name = "portfolio-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Where the bot reads its knowledge from (the live site's data.js).
DATA_URL = "https://sanvisal.github.io/portfolio/js/data.js"
# Comma-separated origins allowed to call the bot. Add your local dev server if you test locally.
ALLOWED_ORIGINS = "https://sanvisal.github.io,http://localhost:5500,http://127.0.0.1:5500"
MODEL = "claude-opus-5-5"
BOT_NAME = "Bit"

# Per-IP rate limit: 8 messages per 60 seconds. Delete this block to disable.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Secret (never commit it):  npx wrangler secret put ANTHROPIC_API_KEY
